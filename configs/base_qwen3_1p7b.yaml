# Common protocol of the controlled comparison, Qwen3-8B -> Qwen3-1.7B-Base
# (Section 5.1, Appendix A.2, B.1, B.2 and B.4). Method files in configs/qwen3_1p7b/
# inherit from this file and change only the objective or a budget.
name: qwen3-1.7b-base

model:
  teacher: Qwen/Qwen3-8B            # frozen teacher
  student: Qwen/Qwen3-1.7B-Base     # initial student
  dtype: bfloat16                   # BF16 model computation; reductions are float32
  device: auto
  gradient_checkpointing: true
  # The teacher's non-thinking chat serialisation with the fixed empty thinking block,
  # used for both teacher and student.
  chat_template_kwargs:
    enable_thinking: false
  # Every serialised prompt must end with the empty thinking block; a template that does
  # not produce it is rejected before any model runs (set to null to disable the check).
  expected_generation_suffix: "<think>\n\n</think>\n\n"
  stop_tokens: ["<|im_end|>"]

data:
  source: math_train                # official MATH training split
  split_seed: 42                    # stratified by subject and difficulty
  num_diagnostic: 500
  num_development: 500
  remove_overlap_with: [math500, amc23, aime24, aime25, minerva, olympiadbench]

rollout:
  batch_size: 128                   # prompts per rollout batch, one response per prompt
  max_response_tokens: 4096         # L_max, including EOS
  temperature: 1.0
  top_p: 1.0
  top_k: null                       # no top-k restriction
  generation_batch_size: 32

optim:
  learning_rate: 3.0e-6             # selected from {1e-6, 3e-6, 1e-5} on development data
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_fraction: 0.03
  min_lr_ratio: 0.0

train:
  seed: 11                          # final runs use seeds 11, 22 and 33
  passes: 3.0                       # matched-rollout budget: three passes over the prompts
  microbatch_size: 8                # accumulated into one optimizer step
  position_block_size: 32           # response positions per full-vocabulary block
  gradient_checkpointing: true      # counted in the FLOPs estimate
  checkpoint_every: 50
  output_dir: runs/qwen3_1p7b/unnamed/seed11

evaluation:
  benchmarks: [math500, amc23, aime24, aime25, minerva, olympiadbench]
  unseen_wrappers: true             # four held-out prefixes (Appendix B.2.2)
  decoding:
    num_samples: 8                  # Avg@8 / Pass@8
    temperature: 1.0
    top_p: 0.8
    max_response_tokens: 8192
    batch_size: 16
    seed: 11
