# EOPD-2V with the coefficients selected on the development split (supplementary E11):
# entropy threshold tau = 0.8 nats, forward-KL coefficient alpha = 1.2. The search itself
# is `python scripts/tune_eopd.py --config configs/qwen3_1p7b/eopd_2v.yaml`.
_base_: ../base_qwen3_1p7b.yaml
name: eopd-2v-tuned
objective:
  name: eopd_2v
  eopd_entropy_threshold: 0.8
  eopd_fkl_weight: 1.2
train:
  output_dir: runs/qwen3_1p7b/eopd_2v_tuned/seed11
